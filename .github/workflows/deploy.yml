name: 🚀 Deploy Next.js to cPanel

on:
  push:
    branches:
      - main # Akan berjalan otomatis setiap Anda push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build

      - name: 📂 Persiapkan Folder Standalone
        run: |
          # Copy folder public dan prisma ke dalam standalone
          cp -r public .next/standalone/ || true
          cp -r prisma .next/standalone/ || true
          # Copy folder static ke tempat yang semestinya
          cp -r .next/static .next/standalone/.next/ || true
          # Trik cPanel: Buat file restart.txt agar Node.js otomatis me-restart diri setelah di-upload!
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      - name: 🚀 Upload via FTP ke cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/standalone/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*